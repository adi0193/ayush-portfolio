# Active once this folder is its own repository (GitHub only reads .github/ at the repo root).
name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
