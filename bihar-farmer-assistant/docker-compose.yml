services:
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      CORS_ORIGIN: http://localhost:8081
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "8081:80"
    depends_on: [api]
    restart: unless-stopped
